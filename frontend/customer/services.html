<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discover services | EZHA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/variables.css" />
    <link rel="stylesheet" href="/static/css/components.css" />
    <link rel="stylesheet" href="/static/css/theme.css" />
    <style>
      .customer-main { padding: 52px 0 88px; }
      .customer-top { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:32px; }
      .customer-top h1 { margin:20px 0 8px; font-size:clamp(2.4rem, 4vw, 3.6rem); }
      .service-tools { display:grid; grid-template-columns:minmax(220px,1fr) minmax(170px,.5fr) minmax(190px,.55fr); gap:10px; margin:28px 0 24px; }
      .service-tools input { min-height:48px; border:1px solid var(--border); background:#fff; border-radius:9px; padding:0 14px; color:var(--text); flex:1; min-width:0; }
      .service-tools select.ezha-filter-select {
        min-height:48px; border:1px solid #7f1d1d; border-radius:9px; padding:0 14px;
        background: linear-gradient(135deg, #047857 0%, #b91c1c 55%, #991b1b 100%);
        color: #fde047; font-weight: 700; text-shadow: 0 0 12px rgba(253, 224, 71, 0.65);
        box-shadow: 0 0 18px rgba(5, 150, 105, 0.35);
      }
      .product-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
      .product-card { border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#fff; display:flex; flex-direction:column; }
      .product-card img { width:100%; aspect-ratio:1; object-fit:cover; }
      .product-body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
      .product-body h3 { margin:0; font-size:.95rem; line-height:1.25; }
      .product-meta { font-size:.78rem; color:var(--muted); }
      .product-price { color:var(--primary); font-weight:800; font-size:.95rem; }
      .product-actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:auto; }
      .product-actions .btn { padding:.55rem .4rem; font-size:.75rem; }
      .pagination { display:flex; gap:8px; justify-content:center; margin-top:28px; flex-wrap:wrap; }
      .pagination button { min-width:40px; }
      .hurray-overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20,16,12,0.55); z-index: 200; padding: 24px; }
      .hurray-overlay[hidden] { display: none; }
      .hurray-card { background: linear-gradient(160deg, #fff9e8, #fff); border: 2px solid rgba(201,162,39,0.5); border-radius: 24px; padding: 36px 32px; text-align: center; max-width: 420px; }
      .customer-nav { display:flex; gap:16px; align-items:center; }
      .cart-badge { min-width:22px; height:22px; border-radius:999px; background:#b91c1c; color:#fde047; font-size:.75rem; font-weight:800; display:inline-grid; place-items:center; padding:0 6px; }
      .empty-state { padding:30px 0; color:var(--muted); }
      @media(max-width:1024px){.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
      @media(max-width:760px){.customer-top{align-items:flex-start;flex-direction:column}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
      @media(max-width:520px){.service-tools{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    </style>
  </head>
  <body data-requires-role="CUSTOMER">
    <div class="ezha-tagline-ribbon">Signature of success</div>
    <header class="site-header">
      <div class="container navbar">
        <a class="brand" href="/" aria-label="EZHA home"><img class="brand-logo" src="/static/assets/ezha-logo.png" alt="EZHA | The Signature of Success" /></a>
        <nav class="customer-nav">
          <a href="/customer/services">Discover</a>
          <a href="/customer/cart">Cart <span class="cart-badge" id="cart-count" hidden>0</span></a>
          <button class="btn btn-secondary" type="button" data-logout>Sign out</button>
        </nav>
      </div>
    </header>
    <main class="container customer-main">
      <div class="customer-top"><div><span class="eyebrow">Customer space</span><h1>Beauty at your doorstep.</h1><p>Browse every service like a storefront — add to cart or buy now.</p></div></div>
      <section class="artisan-card" id="customer-address-panel" style="margin-bottom:28px;padding:20px;border:1px solid var(--border);border-radius:12px">
        <h2 style="margin-top:0;font-size:1.35rem">Your service address</h2>
        <form id="customer-address-form" class="service-tools" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px">
          <label>Mobile<input name="phone" inputmode="tel" /></label>
          <label>PIN code<input name="pincode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required /></label>
          <label style="grid-column:1/-1">Street / house no.<input name="address_line1" required /></label>
          <label>Area<input name="address_line2" /></label>
          <label>City<input name="address_city" required /></label>
          <label>State<input name="address_state" required /></label>
          <button class="btn btn-primary" type="submit" style="grid-column:1/-1">Save address</button>
        </form>
        <p id="customer-address-message" role="status" style="color:var(--primary);margin-top:10px"></p>
      </section>
      <div class="service-tools">
        <input id="service-search" type="search" placeholder="Search services" aria-label="Search services" />
        <select class="ezha-filter-select" id="category-filter" aria-label="Filter by category"><option value="">All categories</option><option value="MAKEUP">Makeup</option><option value="MEHENDI">Mehendi</option><option value="DRESS">Dress</option><option value="FULL_PACKAGE">Full package</option></select>
        <select class="ezha-filter-select" id="city-filter" aria-label="Filter by city"><option value="">All cities</option></select>
      </div>
      <div id="service-groups" class="product-grid" aria-live="polite"><p class="empty-state" style="grid-column:1/-1">Loading services…</p></div>
      <nav class="pagination" id="works-pagination" aria-label="Product pages"></nav>
    </main>
    <div class="hurray-overlay" id="address-hurray" hidden role="dialog" aria-labelledby="hurray-title">
      <div class="hurray-card">
        <div style="font-size:3rem">🎉</div>
        <h2 id="hurray-title">Hurray!</h2>
        <p>Your doorstep address is saved.</p>
        <button type="button" class="btn btn-primary" id="hurray-dismiss">Continue exploring</button>
      </div>
    </div>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/cart.js"></script>
    <script src="/static/js/portal.js"></script>
  </body>
</html>
